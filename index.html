    <style>
        /* ---------- Theme: colors pulled from the DannyXZombie avatar ---------- */
        :root {
            --bg: #0f0814;          /* near-black purple background */
            --surface: #1a0d22;     /* header, footer, panels */
            --surface-2: #241330;   /* video area */
            --accent: #ff2fd2;      /* neon magenta (the name sign) */
            --accent-2: #a84dff;    /* electric purple (headset + controller) */
            --hot: #ff3b3b;         /* red glow (eyes + horns) */
            --text-soft: #e6d9f0;
            --muted: #b49fc4;
        }
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background:
                radial-gradient(1000px 500px at 50% -10%, rgba(255, 47, 210, 0.14), transparent 70%),
                var(--bg);
            background-color: var(--bg);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header, footer {
            background-color: var(--surface);
            padding: 20px 0;
            width: 100%;
            text-align: center;
        }
        header {
            background: transparent;
            padding: 36px 16px 8px;
            box-sizing: border-box;
        }
        /* Avatar with a spinning neon ring behind it */
        .avatar {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 18px;
            border-radius: 50%;
            padding: 4px;
            isolation: isolate;
        }
        .avatar::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(var(--accent), var(--accent-2), var(--hot), var(--accent));
            animation: ring-spin 6s linear infinite;
            z-index: -1;
        }
        .avatar::after {
            content: "";
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 47, 210, 0.45), transparent 70%);
            filter: blur(10px);
            z-index: -2;
        }
        .avatar img {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid var(--bg);
            box-sizing: border-box;
            object-fit: cover;
        }
        @keyframes ring-spin { to { transform: rotate(1turn); } }
        h1 {
            margin: 0;
            font-size: 3em;
            font-weight: 400;
            letter-spacing: 1px;
            font-family: 'Creepster', cursive;
            color: #ffd6f6;
            text-shadow:
                0 0 6px var(--accent),
                0 0 18px var(--accent),
                0 0 36px rgba(255, 47, 210, 0.6);
        }
        .tagline {
            margin: 8px 0 0;
            color: var(--muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 0.85em;
        }
        .description {
            margin: 20px 0;
            font-size: 1.2em;
            text-align: center;
        }
        .social-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            position: relative; /* Added to position the tooltip */
        }
        .button {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            padding: 12px 28px;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-size: 1.15em;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 24px -8px rgba(255, 47, 210, 0.7);
            transition: transform 0.25s cubic-bezier(.2,.8,.2,1), box-shadow 0.25s, filter 0.25s;
            margin-bottom: 10px; /* Space between button and links */
        }
        .button:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 12px 30px -8px rgba(255, 47, 210, 0.9);
        }
        .tooltip {
            display: none;
            position: absolute;
            top: -30px; /* Adjust the position */
            background-color: var(--surface);
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.9em;
            z-index: 1; /* Ensure it's above other elements */
        }
        .social-container:hover .tooltip {
            display: block; /* Show the tooltip on hover */
        }
        .container {
            display: flex;
            width: 100%;
            height: calc(100vh - 220px); /* Adjust based on header/footer height */
        }
        .video-container {
            flex: 3;
            background-color: var(--surface-2);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        #player {
            width: 100%;
            flex: 1;
            min-height: 0;
        }
        /* ---------- Prev / now playing / next bar ---------- */
        .player-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: var(--surface);
            border-top: 1px solid rgba(255, 47, 210, 0.25);
        }
        .player-btn {
            flex: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 44px; /* comfortable tap target */
            padding: 0 18px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 18px -8px rgba(255, 47, 210, 0.7);
            transition: transform 0.2s cubic-bezier(.2,.8,.2,1), filter 0.2s;
        }
        .player-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .player-btn:active { transform: translateY(0); }
        .player-btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
        .player-btn svg { width: 18px; height: 18px; fill: currentColor; }
        /* Shuffle toggle: outlined when off, lit up in neon when on */
        .shuffle-btn {
            flex: none;
            width: 44px;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 2px solid var(--muted);
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s, box-shadow 0.2s, transform 0.2s;
        }
        .shuffle-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .shuffle-btn:hover { transform: translateY(-2px); }
        .shuffle-btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
        .shuffle-btn[aria-pressed="true"] {
            color: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 14px -2px var(--accent);
        }
        .now-playing {
            flex: 1;
            min-width: 0;
            color: var(--text-soft);
            font-size: 0.9em;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .playlist-panel {
            flex: 1;
            background-color: var(--surface);
            padding: 20px;
            overflow-y: auto;
            max-height: 80vh; /* Limit height of the panel */
        }
        .playlist-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            padding: 6px;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background 0.2s, border-color 0.2s;
        }
        .playlist-item:hover { background: var(--surface-2); }
        .playlist-item.active {
            background: var(--surface-2);
            border-color: var(--accent);
            box-shadow: 0 0 14px -4px var(--accent);
        }
        .playlist-item.active span { color: #ffd6f6; }
        .playlist-item img {
            width: 120px;
            height: auto;
            margin-right: 10px;
        }
        footer p {
            color: var(--muted);
            font-size: 0.9em;
        }
        .footer-link { color: var(--muted); text-decoration-color: rgba(255, 47, 210, 0.5); text-underline-offset: 3px; }
        .footer-link:hover { color: var(--accent); }
        /* ---------- Social icons ---------- */
        .social-links {
            display: none;
            flex-direction: row;
            gap: 14px;
            margin-top: 12px;
            padding: 4px;
        }
        .social-links.open {
            display: flex;
        }
        .social-links a {
            --brand: var(--accent);      /* hover fill, overridden per brand below */
            --on-brand: #fff;      /* icon color while hovered */
            position: relative;
            display: grid;
            place-items: center;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            color: var(--text-soft);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: transform 0.25s cubic-bezier(.2,.8,.2,1),
                        background 0.25s, color 0.25s, box-shadow 0.25s, border-color 0.25s;
            /* "backwards" = hidden during the stagger delay, then hands transform back to :hover */
            animation: social-in 0.45s cubic-bezier(.2,.8,.2,1) backwards;
            animation-delay: calc(var(--i) * 45ms);
        }
        .social-links svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
        .social-links a:hover,
        .social-links a:focus-visible {
            transform: translateY(-4px);
            color: var(--on-brand);
            background: var(--brand);
            border-color: transparent;
            box-shadow: 0 10px 24px -8px var(--glow, var(--brand));
            outline: none;
        }
        .social-links a:focus-visible {
            box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent);
        }
        /* Label that pops up under each icon on hover (desktop) */
        .social-links a::after {
            content: attr(data-label);
            position: absolute;
            top: calc(100% + 8px);
            left: 50%;
            transform: translate(-50%, -4px);
            padding: 3px 8px;
            border-radius: 6px;
            background: var(--surface);
            color: #fff;
            font-size: 0.75em;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
        }
        .social-links a:hover::after {
            opacity: 1;
            transform: translate(-50%, 0);
        }
        .social-links .yt { --brand: #ff0033; }
        .social-links .tw { --brand: #9146ff; }
        .social-links .x  { --brand: #fff; --on-brand: #000; --glow: rgba(255,255,255,.5); }
        .social-links .ig { --brand: radial-gradient(circle at 30% 107%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285aeb 90%); --glow: #d6249f; }
        .social-links .fb { --brand: #0866ff; }
        .social-links .tt { --brand: #000; --glow: #fe2c55; }
        .social-links .md { --brand: #ffb800; --on-brand: var(--bg); }
        @keyframes social-in {
            from { opacity: 0; transform: translateY(10px) scale(0.9); }
            to   { opacity: 1; transform: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            .social-links a { animation: none; transition: none; }
            .avatar::before { animation: none; }
        }

        /* Phones and small tablets: stack the player above the playlist */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.4em;
                padding: 0 12px;
            }
            .description {
                font-size: 1em;
                padding: 0 16px;
            }
            .container {
                flex-direction: column;
                height: auto;
            }
            .video-container {
                flex: none;
                width: 100%;
            }
            #player {
                flex: none;
                height: auto;
                aspect-ratio: 16 / 9;
            }
            .player-controls { padding: 8px 10px; gap: 8px; }
            .player-btn { padding: 0 14px; }
            .player-btn .btn-text { display: none; } /* icons only on phones */
            .player-btn svg { width: 22px; height: 22px; }
            .playlist-panel {
                flex: none;
                max-height: 60vh;
                padding: 12px;
                box-sizing: border-box;
            }
            .playlist-item img {
                width: 96px;
            }
            .playlist-item span {
                font-size: 0.9em;
            }
            .social-links {
                flex-wrap: wrap;
                justify-content: center;
            }
            .social-links {
                gap: 8px; /* 7 x 42px + 6 x 8px = 342px: one row on a 360px+ phone */
            }
            .social-links a {
                width: 42px;
                height: 42px;
            }
            .social-links svg {
                width: 20px;
                height: 20px;
            }
            .social-links a::after {
                display: none; /* no hover on touch screens */
            }
        }
    </style>
</head>

        let player;
        let currentIndex = 0;      // position in `videos` of what's playing now
        let unmutedOnce = false;   // so the 50% volume is only applied the first time

        // ---------- Play order: shuffle deck or list order, remembered across reloads ----------
        const STORE_KEY = 'dxz-player';
        let shuffleOn = true;      // default for first-time visitors
        let order = [];            // shuffled positions in `videos`; each appears exactly once
        let deckPos = 0;           // where we are in `order`

        // Fisher–Yates: every arrangement is equally likely
        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Fresh deck that never starts with `avoid` (so a new round can't repeat the last video)
        function newDeck(avoid) {
            const deck = shuffle(videos.map((_, i) => i));
            if (deck[0] === avoid && deck.length > 1) [deck[0], deck[1]] = [deck[1], deck[0]];
            return deck;
        }

        // Saved as video IDs, not positions, so adding/removing videos later can't scramble it.
        // Wrapped in try/catch: storage can be blocked (private mode, strict privacy settings).
        function saveState() {
            try {
                localStorage.setItem(STORE_KEY, JSON.stringify({
                    shuffle: shuffleOn,
                    order: order.map(i => videos[i].id),
                    last: videos[currentIndex].id
                }));
            } catch (e) { /* not saved; the player still works */ }
        }

        function loadState() {
            let saved = null;
            try { saved = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) {}
            const indexOfId = id => videos.findIndex(v => v.id === id);

            if (saved && typeof saved.shuffle === 'boolean') shuffleOn = saved.shuffle;
            const last = saved ? indexOfId(saved.last) : -1;

            // Reuse the saved deck only if it still matches the current video list exactly
            const savedOrder = saved && Array.isArray(saved.order) ? saved.order.map(indexOfId) : [];
            const deckValid = savedOrder.length === videos.length &&
                              new Set(savedOrder).size === videos.length && !savedOrder.includes(-1);

            order = deckValid ? savedOrder : newDeck(last);

            if (last === -1) {
                // First visit: start at the top of the deck (or anywhere, in list mode)
                currentIndex = shuffleOn ? order[0] : Math.floor(Math.random() * videos.length);
            } else {
                // Returning: start on the video AFTER the one played last time, never the same one
                currentIndex = pickNextIndex(last, 1);
            }
            deckPos = order.indexOf(currentIndex);
            saveState();
        }

        // Load YouTube API
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            randomizeAndLoadVideo();
            displayPlaylist();
        }

        function randomizeAndLoadVideo() {
            loadState();   // picks currentIndex: next in the saved deck, or a fresh start
            setShuffle(shuffleOn);   // make the toggle match the saved setting

            player = new YT.Player('player', {
                width: '100%',
                height: '100%',
                videoId: videos[currentIndex].id,
                playerVars: {
                    autoplay: 1,
                    controls: 1,
                    mute: 1,          // browsers only allow autoplay when muted
                    rel: 0,
                    playsinline: 1    // play inside the page on iPhones, not fullscreen
                },
                events: {
                    onReady: () => markActive(false),
                    onStateChange: onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            // When a video finishes, roll straight into the next one
            if (event.data === YT.PlayerState.ENDED) {
                step(1);
            }
            // The first time the viewer unmutes, start them at 50% instead of full blast
            if (event.data === YT.PlayerState.PLAYING && !unmutedOnce && !player.isMuted()) {
                unmutedOnce = true;
                player.setVolume(50);
            }
        }

        /**
         * Decide which video plays after `current`.
         * direction is +1 (Next button / video ended) or -1 (Prev button).
         * Must return a valid index into `videos` (0 to videos.length - 1).
         */
        function pickNextIndex(current, direction) {
            if (!shuffleOn) {
                // List order with wrap-around. Adding videos.length first keeps
                // the result positive when going back from video 0.
                return (current + direction + videos.length) % videos.length;
            }
            // Shuffle: step through the deck. Prev really goes back; no repeats until all are played.
            let pos = order.indexOf(current) + direction;
            if (pos >= order.length) {          // whole deck played: reshuffle for a new round
                order = newDeck(current);
                pos = 0;
            }
            if (pos < 0) pos = order.length - 1;
            deckPos = pos;
            return order[pos];
        }

        function step(direction) {
            playIndex(pickNextIndex(currentIndex, direction));
        }

        function playIndex(index) {
            currentIndex = index;
            deckPos = order.indexOf(index);  // playlist clicks: carry on through the deck from here
            player.loadVideoById(videos[index].id);
            markActive(true);
            saveState();
        }

        function setShuffle(on) {
            shuffleOn = on;
            const btn = document.getElementById('shuffle-btn');
            btn.setAttribute('aria-pressed', on);
            btn.title = on ? 'Shuffle is on' : 'Shuffle is off (playing in list order)';
            saveState();
        }

        // Highlight the playing video in the panel and show its title under the player
        function markActive(scroll) {
            document.querySelectorAll('.playlist-item').forEach((item, i) => {
                const isActive = i === currentIndex;
                item.classList.toggle('active', isActive);
                item.setAttribute('aria-current', isActive ? 'true' : 'false');
                if (isActive && scroll) item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            });
            document.getElementById('now-playing').textContent = videos[currentIndex].title;
        }

        function displayPlaylist() {
            const playlistPanel = document.getElementById('playlist-panel');
            playlistPanel.innerHTML = ''; // Clear the panel
            videos.forEach((video, i) => {
                const item = document.createElement('div');
                item.className = 'playlist-item';
                item.onclick = () => playIndex(i);
                item.innerHTML = `
                    <img src="https://img.youtube.com/vi/${video.id}/default.jpg" alt="" loading="lazy">
                    <span>${video.title}</span>
                `;
                playlistPanel.appendChild(item);
            });
        }

        document.getElementById('prev-btn').addEventListener('click', () => step(-1));
        document.getElementById('next-btn').addEventListener('click', () => step(1));
        document.getElementById('shuffle-btn').addEventListener('click', () => setShuffle(!shuffleOn));

        function toggleSocialLinks() {
            const socialLinks = document.getElementById('social-links');
            const isOpen = socialLinks.classList.toggle('open');
            document.querySelector('.social-container .button').setAttribute('aria-expanded', isOpen);
        }
